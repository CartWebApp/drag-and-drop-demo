<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag and Drop Demo</title>
    <link rel="stylesheet" href="app.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <ol id="todo-list" class="sortable-list">
      <li class="item" draggable="true" id="item-1">Buy Groceries</li>
      <li class="item" draggable="true" id="item-2">Email Team</li>
      <li class="item" draggable="true" id="item-3">Go to Gym</li>
      <li class="item" draggable="true" id="item-4">Read 10 Pages</li>
      <li class="item" draggable="true" id="item-5">Finish To Do App</li>
    </ol>
  </body>
</html>
